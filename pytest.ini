[pytest]
# Where the tests live (one test file per functionality F1..F8).
testpaths = tests

# Add the project root to sys.path so tests can simply write
#   from src.f2_hinglish_features import extract_text_features
# with no packaging tricks and no sys.path hacks inside test files.
pythonpath = .

# -v   = show one line per test (readable during a demo)
# -ra  = short summary of anything that did not pass
addopts = -v -ra
